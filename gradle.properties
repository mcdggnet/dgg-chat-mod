org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Bumped on release. CI tags drive the published version, so a tag of v0.2.0
# publishes 0.2.0 regardless of what is committed here.
modVersion=0.2.0

# Where CI's JDKs live (actions/setup-java exports these); ignored when unset.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
