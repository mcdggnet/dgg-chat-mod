name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The release workflow asks for more, separately.
permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ModDevGradle downloads and decompiles Minecraft on a cold cache, which is slow
      # and large. setup-gradle caches the Gradle user home between runs; this covers
      # the NeoForm runtime work products it keeps outside the dependency cache.
      - name: Cache NeoForm runtime
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('neoforge/build.gradle.kts') }}
          restore-keys: neoform-${{ runner.os }}-

      - run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: DGGChat-NeoForge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
