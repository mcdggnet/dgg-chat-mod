name: release

# Tag drives the version: `git tag v0.2.0 && git push --tags` publishes 0.2.0,
# regardless of the modVersion committed in gradle.properties.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the Release and attach jars
  packages: write   # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache NeoForm runtime
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('neoforge/build.gradle.kts') }}
          restore-keys: neoform-${{ runner.os }}-

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -PmodVersion=${{ steps.v.outputs.version }} --stacktrace

      # The api artifact, so dggauth can compile against the SPI as compileOnly.
      # GITHUB_TOKEN is scoped to this repo and expires with the job.
      - name: Publish to GitHub Packages
        run: ./gradlew publish -PmodVersion=${{ steps.v.outputs.version }} --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What people actually download. Releases, not a container registry: a mod is a
      # jar you drop in a mods folder, and GHCR would only wrap it in an OCI artifact
      # that no Minecraft launcher can read.
      # Idempotent on purpose: a release may already exist when the tag was cut by
      # hand with `gh release create` (which is also what pushes the tag that
      # triggered this run). In that case keep the release and swap in the CI-built
      # jar, which is the canonical artifact. v0.1.0 and v0.1.1 both failed here
      # for exactly this reason.
      - name: Publish the Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              neoforge/build/libs/DGGChat-NeoForge-${{ steps.v.outputs.version }}.jar
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              neoforge/build/libs/DGGChat-NeoForge-${{ steps.v.outputs.version }}.jar
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
